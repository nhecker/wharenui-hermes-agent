name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-1-run-agent:
    name: "Tier 1 blocking gate (tests/run_agent, zero failures)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      # The blocking gate imports plugin canaries; check out the plugin explicitly so runner collection matches dev.
      - name: Checkout plugin (sibling inside workspace)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: 0215a22babec95613cf5252c0f9c69677c41f35b
          path: ./wharenui-hermes-agent-plugin
      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27
      - name: Run Tier 1 gate
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 .github/scripts/run_tests.py --selector tests/run_agent --mode xdist --min-collected 2186

  privacy-gate:
    name: "Privacy floor (subset)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Checkout plugin (sibling inside workspace)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: main
          path: ./wharenui-hermes-agent-plugin

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run fast privacy subset
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 .github/scripts/run_tests.py --selector tests/run_agent -m "wharenui_seam" --min-collected 74 --mode serial
  fork-without-plugin:
    name: "Fork without plugin (non-blocking pre-merge canary)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run pre-merge population with baseline delta (non-blocking canary)
        run: |
          echo "Excluded plugin-dependent seam files: 11"
          python3 .github/scripts/run_tests.py --selector tests/agent tests/run_agent --mode xdist --baseline-file .github/baseline-pre-merge.txt --baseline-collected-file .github/baseline-pre-merge-collected.txt --ignore=tests/run_agent/test_all_channels_canary.py --ignore=tests/run_agent/test_hook_bus_canary.py --ignore=tests/run_agent/test_journal_canary.py --ignore=tests/run_agent/test_journal_persistence.py --ignore=tests/run_agent/test_message_hook_canary.py --ignore=tests/run_agent/test_phase_e2e.py --ignore=tests/run_agent/test_public_reopen.py --ignore=tests/run_agent/test_real_handler_canary.py --ignore=tests/run_agent/test_real_loop_canary.py --ignore=tests/run_agent/test_session_db_isolation.py --ignore=tests/run_agent/test_tool_hook_canary.py

  version-mismatch:
    name: "Version mismatch refusal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Checkout plugin (mismatched version)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: main
          path: ./wharenui-hermes-agent-plugin

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run matrix tests
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 -m pytest tests/run_agent/test_seam_handshake.py -v

  measure-baseline:
    name: "Measure T2 Baseline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"
      - run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27
      - name: Measure
        run: |
          echo "Running 1"
          python3 -m pytest tests/agent -p no:randomly -q --tb=no > run1.log || true
          echo "Running 2"
          python3 -m pytest tests/agent -p no:randomly -q --tb=no > run2.log || true
          echo "Running 3"
          python3 -m pytest tests/agent -p no:randomly -q --tb=no > run3.log || true
          grep "^FAILED" run1.log | awk '{print $2}' | sort > fails1.txt
          grep "^FAILED" run2.log | awk '{print $2}' | sort > fails2.txt
          grep "^FAILED" run3.log | awk '{print $2}' | sort > fails3.txt
          echo "Run 1 size: $(wc -l < fails1.txt)"
          echo "Run 2 size: $(wc -l < fails2.txt)"
          echo "Run 3 size: $(wc -l < fails3.txt)"
          comm -12 fails1.txt fails2.txt > int12.txt
          comm -12 int12.txt fails3.txt > intersection.txt
          cat fails1.txt fails2.txt fails3.txt | sort -u > union.txt
          echo "Intersection size: $(wc -l < intersection.txt)"
          echo "Union size: $(wc -l < union.txt)"
          echo "--- INTERSECTION ---"
          cat intersection.txt
          echo "--- UNION ---"
          cat union.txt
          echo "--- RUN 1 WALLCLOCK ---"
          grep "in " run1.log | tail -n 1
