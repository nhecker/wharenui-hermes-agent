name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier-1-run-agent:
    name: "Tier 1 blocking gate (tests/run_agent, zero failures)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      # The blocking gate imports plugin canaries; check out the plugin explicitly so runner collection matches dev.
      - name: Checkout plugin (sibling inside workspace)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: 0215a22babec95613cf5252c0f9c69677c41f35b
          path: ./wharenui-hermes-agent-plugin
      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27
      - name: Run Tier 1 gate
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 .github/scripts/run_tests.py --selector tests/run_agent --mode xdist --min-collected 2174

  privacy-gate:
    name: "Privacy floor (subset)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Checkout plugin (sibling inside workspace)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: main
          path: ./wharenui-hermes-agent-plugin

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run fast privacy subset
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 .github/scripts/run_tests.py --selector tests/run_agent -m "wharenui_seam" --min-collected 62 --mode serial
  fork-without-plugin:
    name: "Fork without plugin (non-blocking pre-merge canary)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run pre-merge population with baseline delta (non-blocking canary)
        run: |
          python3 .github/scripts/run_tests.py --selector tests/agent tests/run_agent --mode xdist --baseline-file .github/baseline-pre-merge.txt --baseline-collected-file .github/baseline-pre-merge-collected.txt

  version-mismatch:
    name: "Version mismatch refusal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Checkout plugin (mismatched version)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent-plugin
          ref: main
          path: ./wharenui-hermes-agent-plugin

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run matrix tests
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}/wharenui-hermes-agent-plugin
        run: |
          python3 -m pytest tests/run_agent/test_seam_handshake.py -v
